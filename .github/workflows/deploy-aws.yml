
name: Deploy AWS Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws-ingestao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build e testes
        run: |
          mvn -B clean verify
          echo "JARs gerados pelo Maven:"
          ls -lh target/*.jar

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::822870181640:role/tech4-github-actions-deploy-role
          aws-region: us-east-1

      - name: Publicar Lambda
        run: |
          aws lambda update-function-code \
            --function-name ingestao-avaliacao \
            --zip-file fileb://target/ingestao-avaliacao-0.0.1-SNAPSHOT-shaded.jar \
            --region us-east-1

      - name: Aguardar atualização
        run: |
          aws lambda wait function-updated \
            --function-name ingestao-avaliacao \
            --region us-east-1
